name: Compilar y probar Inmobiliaria

# Cada push o PR hacia main pasa por aquí.
# El "en mi máquina funciona" tendrá que convencer también a Ubuntu.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      checks: write

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      # Traemos todo el historial para que Sonar pueda comparar los cambios.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Ubuntu descarga las referencias necesarias para compilar Windows Forms.
      # Hasta el escritorio tiene que pasar lista.
      - name: Restore dependencies
        run: dotnet restore Inmobiliaria.sln -p:EnableWindowsTargeting=true

      - name: Install SonarScanner
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: SonarCloud analysis skipped
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "Configura el secreto SONAR_TOKEN para activar SonarQube Cloud."

      # Sonar empieza antes del build para recoger la información de compilación.
      - name: Begin SonarCloud analysis
        id: sonar_begin
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          dotnet sonarscanner begin \
            /o:"tesisenel" \
            /k:"TesisEnel_UASD_Inmoviliaria_Luilton_Jerferson_2023-02" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io"

      # Compilamos todos los proyectos incluidos en la solución.
      - name: Build solution
        id: compilacion
        run: dotnet build Inmobiliaria.sln --configuration Release --no-restore -p:EnableWindowsTargeting=true

      # Las pruebas de integración se compilan con la solución.
      # Su ejecución requiere la instancia SQLEXPRESS configurada en Windows.
      - name: Test services
        if: ${{ !cancelled() && steps.compilacion.outcome == 'success' }}
        run: dotnet test tests/Inmobiliaria.Application.UnitTests/Inmobiliaria.Application.UnitTests.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=servicios.trx" --results-directory TestResults

      # Si los servicios fallan, la web todavía tiene su propio examen.
      - name: Test web
        if: ${{ !cancelled() && steps.compilacion.outcome == 'success' }}
        run: dotnet test tests/Inmobiliaria.Web.Tests/Inmobiliaria.Web.Tests.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=web.trx" --results-directory TestResults

      # Enviamos el análisis aunque una prueba haya fallado,
      # siempre que Sonar haya iniciado y la compilación haya terminado bien.
      - name: End SonarCloud analysis
        if: ${{ !cancelled() && steps.sonar_begin.outcome == 'success' && steps.compilacion.outcome == 'success' }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # Los resultados aparecen directamente en Checks.
      # Si no se generaron reportes, evitamos un segundo error que tape al primero.
      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() && hashFiles('TestResults/**/*.trx') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          name: Resultados .NET - Servicios y Web
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx
